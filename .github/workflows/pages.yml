name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Check JavaScript
        run: npm run check
      - name: Prepare game files
        run: |
          mkdir -p '_site/Changoo (E)/RESOURCE'
          cp index.html _site/
          cp -R web _site/
          cp 'Changoo (E)/RESOURCE.RES' '_site/Changoo (E)/'
          cp 'Changoo (E)/RESOURCE/CHAR.CFG' 'Changoo (E)/RESOURCE/'*.WAV '_site/Changoo (E)/RESOURCE/'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
